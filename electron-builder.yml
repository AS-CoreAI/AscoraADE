appId: com.ascora.ade
productName: Ascora ADE
copyright: Copyright © 2026 ASCore AI (ascoreai.com)

directories:
  output: dist
  buildResources: build

# Only `out/**` (the electron-vite bundle) and the runtime deps are needed.
# The renderer libs (monaco, react, dockview, allotment, xterm, zustand) are
# bundled into out/renderer by Vite, so they're pruned from node_modules here —
# ssh2 is the only production dependency required at runtime in the main process.
asar: true
files:
  - out/**/*
  - package.json
  - "!node_modules/monaco-editor/**"
  - "!node_modules/@monaco-editor/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/dockview/**"
  - "!node_modules/dockview-react/**"
  - "!node_modules/dockview-core/**"
  - "!node_modules/allotment/**"
  - "!node_modules/@xterm/**"
  - "!node_modules/zustand/**"

# The bundled OmniRoute gateway (vendored by scripts/omniroute/vendor.mjs) is
# a plain-JS npm tree that runs as a child process via ELECTRON_RUN_AS_NODE —
# it lives outside the asar so Node can resolve its modules normally.
extraResources:
  - from: .build/omniroute
    to: omniroute
  - THIRD_PARTY_NOTICES.md

win:
  icon: build/icon.png
  # Bundled VPN backends (vendored by scripts/vpn/vendor.mjs): a portable
  # wireguard.exe (drivers embedded) plus the official OpenVPN MSI that the
  # app installs silently on first OpenVPN connect. Windows-only — Linux uses
  # distro packages.
  extraResources:
    - from: .build/vpn
      to: vpn
  # Never publish an unsigned Windows artifact. Release/CI must provide an
  # OV/EV certificate issued to exactly "ASCore AI" via WIN_CSC_LINK and
  # WIN_CSC_KEY_PASSWORD (or make it available in the certificate store).
  forceCodeSigning: true
  publisherName:
    - ASCore AI
  legalTrademarks: ASCore AI — https://ascoreai.com
  signtoolOptions:
    publisherName: ASCore AI
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Ascora-ADE-Setup-${version}.${ext}
  shortcutName: Ascora ADE
  uninstallDisplayName: Ascora ADE ${version}

portable:
  artifactName: Ascora-ADE-Portable-${version}.${ext}
  # Stable unpack dir so the ~1.2 GB uncompressed OmniRoute resource tree is not
  # re-extracted on every portable launch.
  unpackDirName: ascora-ade

linux:
  icon: build/icon.png
  category: Development
  maintainer: Ascora <support@ascoreai.com>
  target:
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
    - target: pacman
      arch: [x64]
    - target: AppImage
      arch: [x64]

deb:
  artifactName: Ascora-ADE-${version}-${arch}.${ext}

rpm:
  artifactName: Ascora-ADE-${version}-${arch}.${ext}

pacman:
  artifactName: Ascora-ADE-${version}-${arch}.${ext}

appImage:
  artifactName: Ascora-ADE-${version}-${arch}.${ext}
